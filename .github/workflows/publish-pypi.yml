name: publish-pypi
# Build the sdist + wheel, check them, and publish with PyPI "trusted publishing" (OIDC: no API token is stored).
#   * Manual run (workflow_dispatch) -> TestPyPI, to rehearse the release and `pip install` it from there.
#   * Tag v*                          -> PyPI.
# One-time setup (by the project owner, on pypi.org and test.pypi.org): Account -> Publishing -> add a pending
# publisher: owner rajratangm, repo tinyforge, workflow publish-pypi.yml, environment pypi (resp. testpypi).
# NOT yet exercised: the first run is the first TestPyPI rehearsal. PyPI versions cannot be re-uploaded, so
# rehearse on TestPyPI first and bump the version in pyproject.toml + src/tinyforge/__init__.py for each attempt.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The version in the tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$tag" = "$pkg" || { echo "tag $tag != package version $pkg"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write       # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { repository-url: "https://test.pypi.org/legacy/" }

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
