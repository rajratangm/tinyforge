name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --require-hashes -r requirements/lock-cpu-linux-py${{ matrix.python == '3.10' && '310' || '312' }}.txt
      - run: pip install --no-deps -e .
      - run: ruff check src tests
      # Advisory until the 20 baseline errors (mostly torch/numpy typing) are burned down; then drop continue-on-error.
      - run: mypy
        continue-on-error: true
      - run: pytest -q

  # forgectl (Go control CLI): vet, unit tests, build, and validate the example spec with the built binary.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/jobspec -run xxx -fuzz FuzzParse -fuzztime 20s
      - run: go test ./internal/netcheck -run xxx -fuzz FuzzParse -fuzztime 20s
      - run: go build -o forgectl ./cmd/forgectl
      - run: ./forgectl validate -f spec/examples/sql-finetune.yaml

  # Known-vulnerability scan of the hashed lock (torch excluded from the CPU lock: torch 2.6.0 has open advisories,
  # tracked in SECURITY.md until the torch upgrade lands). Blocking.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit
      - run: pip-audit --no-deps --disable-pip -r requirements/lock-cpu-linux-py312.txt

  # Supply-chain checks: Go advisories reachable from our code, and committed secrets (full history).
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  # Real-GPU training/eval gate: runs on a self-hosted GPU runner (see infra/terraform).
  gpu-e2e:
    if: github.ref == 'refs/heads/main'
    needs: [lint-test]
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install -e ".[dev]"
      - run: tinyforge pipeline --preset micro --steps 300
