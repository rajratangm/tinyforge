{{- if .Values.rbac.create }}
# Namespace-scoped on purpose: the controller manages TrainingJobs and the batch Jobs/Pods it creates in one
# namespace only. No ClusterRole, no wildcard verbs, no Secrets access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tinyforge.fullname" . }}-controller
  namespace: {{ default .Release.Namespace .Values.controller.watchNamespace }}
  labels:
    {{- include "tinyforge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tinyforge.dev"]
    resources: ["trainingjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tinyforge.dev"]
    resources: ["trainingjobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tinyforge.fullname" . }}-controller
  namespace: {{ default .Release.Namespace .Values.controller.watchNamespace }}
  labels:
    {{- include "tinyforge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tinyforge.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "tinyforge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
