global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/rules.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: gpu
    static_configs: [{ targets: ["nvidia-gpu-exporter:9835"] }]

  # /metrics is implemented; enable once a token file is mounted (rules.yml alerts on job="tinyforge"):
  # - job_name: tinyforge
  #   authorization: { credentials_file: /etc/prometheus/tinyforge_token }
  #   static_configs: [{ targets: ["host.docker.internal:8000"] }]
