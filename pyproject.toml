[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyforge"
version = "0.1.0"
description = "Local-first fine-tuning toolkit: hardware-aware planning, data checks, training beyond VRAM, benchmarks and serving with guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tinyforge contributors" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "gguf", "llama.cpp", "local", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "tokenizers>=0.19",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "mypy>=1.10", "hypothesis>=6.100"]
triton = ["triton>=3.0; platform_system == 'Linux'", "triton-windows; platform_system == 'Windows'"]
finetune = ["transformers>=4.45", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33", "bitsandbytes>=0.43"]
jax = ["jax[cuda12]; platform_system == 'Linux'"]
aws = ["boto3>=1.34"]
docs = ["markitdown[pdf,docx,pptx,xlsx]>=0.1"]
bench = ["lm-eval>=0.4"]
all = ["tinyforge[finetune,docs,bench]"]

[project.urls]
Homepage = "https://github.com/rajratangm/tinyforge"
Issues = "https://github.com/rajratangm/tinyforge/issues"
Changelog = "https://github.com/rajratangm/tinyforge/blob/main/CHANGELOG.md"

[project.scripts]
tinyforge = "tinyforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyforge = ["ui/*", "*.json"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/tinyforge/modelcard.py" = ["E501"]  # prose strings
"src/tinyforge/memtiers.py" = ["E501"]  # long explanatory strings
"src/tinyforge/methods.py" = ["E501"]  # prose strings
"src/tinyforge/telemetry.py" = ["E501"]  # prose strings
"src/tinyforge/engines.py" = ["E501"]  # prose strings
"tests/test_modelcard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor = measured 64% (2026-10-07) minus slack; raise it as tests are added, never lower it.
addopts = "--cov=tinyforge --cov-fail-under=60"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]
