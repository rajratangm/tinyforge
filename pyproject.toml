[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyforge"
version = "0.1.0"
description = "Train, evaluate and serve small LLMs on modest GPUs - CLI, API and web UI."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "tokenizers>=0.19",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
triton = ["triton>=3.0; platform_system == 'Linux'", "triton-windows; platform_system == 'Windows'"]
finetune = ["transformers>=4.45", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33", "bitsandbytes>=0.43"]
jax = ["jax[cuda12]; platform_system == 'Linux'"]
aws = ["boto3>=1.34"]

[project.scripts]
tinyforge = "tinyforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyforge = ["ui/*"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
